name: Production visual verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "package.json"
      - "scripts/visual-check.mjs"
      - ".github/workflows/visual-check.yml"

permissions:
  contents: read

concurrency:
  group: globexplore-production-visual-check
  cancel-in-progress: true

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://globexplore.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install application dependencies
        run: npm install --no-audit --no-fund
      - name: Install browser verification runtime
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Verify production UI and interactions
        run: node scripts/visual-check.mjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: globexplore-production-visual-check
          path: artifacts/visual-check
          if-no-files-found: error
          retention-days: 14
